# https://github.com/karen-sy/srt-slurm-nv/blob/fe04d4e267bc97c219b674eb7127a5ee3a3dfe88/recipes/inference_day_pareto/onehour_agg_eagle_kv_routing_conc24.yaml
name: agg_offload_tep8x3_eagle-kv-conc24

identity:
  model:
    repo: nvidia/Kimi-K2.5-NVFP4
    revision: e4e908c073784de20ad3af0be653421f1088922d
  frameworks:
    dynamo: 1.2.0
    tensorrt_llm: 1.3.0rc16

model:
  path: kimi-k25-nvfp4
  container: dyn-121-trtllm-rc16-condp-v1-isl
  precision: fp4

resources:
  gpu_type: gb200
  agg_nodes: 6
  agg_workers: 3
  gpus_per_agg: 8
  gpus_per_node: 4

slurm:
  time_limit: "00:32:00"

backend:
  type: trtllm
  aggregated_environment:
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: "2"
    OTEL_SERVICE_NAME: "dynamo-agg-tep8x3-eagle-kv-conc24"
    DYN_REASONING_PARSER: kimi_k25
    DYN_TOOL_CALL_PARSER: kimi_k2
  trtllm_config:
    aggregated:
      otlp_traces_endpoint: "http://10.57.209.4:4317"
      allreduce_strategy: MNNVL
      max_num_tokens: 8192
      enable_chunked_prefill: true
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        enable_padding: true
      enable_attention_dp: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.75
        tokens_per_block: 32
        host_cache_size: 85899345920  # 80 GiB host-memory KV offload (100 doesn't fit)
        secondary_offload_min_priority: 35
      max_batch_size: 128
      moe_config:
        backend: CUTLASS
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cuda_core
      num_postprocess_workers: 8
      print_iter_log: true
      stream_interval: 10
      tensor_parallel_size: 8
      trust_remote_code: true
      speculative_config:
        decoding_type: Eagle3
        max_draft_len: 3
        allow_advanced_sampling: true
        speculative_model_dir: /speculative-model

frontend:
  type: dynamo
  args:
    router-mode: kv
    router-reset-states: true
  enable_multiple_frontends: false
  env:
    OTEL_SERVICE_NAME: "dynamo-frontend-tep8x3-eagle-kv-conc24"

health_check:
  max_attempts: 500
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 24

observability:
  enable_otel: true
  otel_endpoint: "http://10.57.209.4:4317"

extra_mount:
  - "/lustre/fsw/coreai_dlfw_dev/karenc/srt-slurm/traces:/traces"
  - "/lustre/fsw/coreai_dlfw_dev/karenc/models/Kimi-K2.5-Thinking-Eagle3:/speculative-model"

benchmark:
  type: trace-replay
  trace_file: /traces/kv-reuse-difficult_200k-fixed/dataset.jsonl
  concurrencies: "24"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "aiperf>=0.7.0"
  aiperf_args:
    benchmark-duration: 1200
    benchmark-grace-period: 60
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 60
    export-http-trace: true