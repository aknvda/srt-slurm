# Rate-matched disagg: 3P + 4D, all TP2 (14 GPUs, 7 nodes)
# P:D ratio = 1:1.33, ideal = 1:1.32 — Excellent match ★
name: disagg_offload_tep2x3p_tep2x4d

identity:
  model:
    repo: nvidia/qwen3-235b-a22b-instruct-2507-nvfp4
  frameworks:
    dynamo: 1.2.0
    vllm: 0.21.0+cu129

model:
  path: qwen3-235b-a22b-instruct-2507-nvfp4
  container: ai-dynamo-vllm-runtime-1.3.0-dev.1-cuda12-aarch64
  precision: fp4

resources:
  gpu_type: gb200
  gpus_per_node: 4
  prefill_nodes: 3
  prefill_workers: 3
  gpus_per_prefill: 2
  decode_nodes: 4
  decode_workers: 4
  gpus_per_decode: 2

slurm:
  time_limit: "00:45:00"

backend:
  type: vllm
  kv_events_config:
    prefill: true
    decode: true
  prefill_environment:
    OTEL_SERVICE_NAME: "dynamo-prefill-tep2x3-kv"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    # NIXL side channel config (required for NixlConnector handshake)
    VLLM_NIXL_SIDE_CHANNEL_PORT: "5600"
    UCX_NET_DEVICES: "all"
    VLLM_USE_FLASHINFER_MOE_FP4: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    DYN_TOOL_CALL_PARSER: hermes
    DYN_REASONING_PARSER: qwen3
  decode_environment:
    OTEL_SERVICE_NAME: "dynamo-decode-tep2x4-kv"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    # NIXL side channel config (required for NixlConnector handshake)
    VLLM_NIXL_SIDE_CHANNEL_PORT: "5700"
    UCX_NET_DEVICES: "all"
    VLLM_USE_FLASHINFER_MOE_FP4: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    DYN_TOOL_CALL_PARSER: hermes
    DYN_REASONING_PARSER: qwen3
  vllm_config:
    prefill:
      tensor-parallel-size: 2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      max-model-len: 262144
      block-size: 64
      max-num-batched-tokens: 16384
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      # cpu_bytes_to_use = 120 GB/rank × 1073741824 = 128849018880 bytes (per-rank, NOT total)
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both"},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":128849018880}}]}}'
      disaggregation-mode: prefill
      trust-remote-code: true
      otlp-traces-endpoint: "http://10.57.209.4:4317"
    decode:
      tensor-parallel-size: 2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      max-model-len: 262144
      block-size: 64
      max-num-batched-tokens: 256
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      # cpu_bytes_to_use = 120 GB/rank × 1073741824 = 128849018880 bytes (per-rank, NOT total)
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both"},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":128849018880}}]}}'
      disaggregation-mode: decode
      trust-remote-code: true
      otlp-traces-endpoint: "http://10.57.209.4:4317"

frontend:
  type: dynamo
  args:
    router-mode: kv
    router-reset-states: true
  enable_multiple_frontends: false
  env:
    OTEL_SERVICE_NAME: "dynamo-frontend-disagg-tep2x3p-tep2x4d"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"

health_check:
  max_attempts: 500
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 24

observability:
  enable_otel: true
  otel_endpoint: "http://10.57.209.4:4317"

sweep:
  concurrency: [36, 60, 80, 96]

extra_mount:
  - "traces:/traces"

benchmark:
  type: trace-replay
  trace_file: /traces/mooncake_conversation_trace.jsonl
  concurrencies: "{concurrency}"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    fixed-schedule: true
    benchmark-duration: 1800
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
